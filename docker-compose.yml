services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: noteartist-db
    environment:
      POSTGRES_USER: ${DB_USER:-noteartist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-noteartist123}
      POSTGRES_DB: ${DB_NAME:-noteartist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 开发环境暴露端口，生产环境应移除
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-noteartist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noteartist-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: noteartist-redis
    # 开发环境暴露端口，生产环境应移除
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noteartist-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: noteartist-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    # 开发环境暴露端口，生产环境应移除或限制
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - noteartist-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noteartist-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-noteartist}:${DB_PASSWORD:-noteartist123}@db:5432/${DB_NAME:-noteartist}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-noteartist-images}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      # AI API (via Antigravity proxy)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:8045}
      TEXT_MODEL: ${TEXT_MODEL:-gemini-3-flash}
      IMAGE_MODEL: ${IMAGE_MODEL:-gemini-3-pro-image}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1024}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - noteartist-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noteartist-frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      REACT_APP_STORAGE_URL: ${REACT_APP_STORAGE_URL:-http://localhost:9000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - noteartist-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: noteartist-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - minio
    profiles:
      - production
    networks:
      - noteartist-network

networks:
  noteartist-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
